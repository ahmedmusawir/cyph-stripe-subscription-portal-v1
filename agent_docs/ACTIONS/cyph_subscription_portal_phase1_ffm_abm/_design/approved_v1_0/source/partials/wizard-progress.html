<!-- Wizard progress: runtime marks steps from body[data-step]. Desktop: 4 labelled steps. Mobile: "Step n of 4 · label" + bar. -->
<nav aria-label="Signup progress" class="mb-6">
  <ol class="hidden items-center gap-2 text-sm sm:flex" data-progress>
    <li data-step-item="1" class="flex items-center gap-2"><span class="grid h-6 w-6 place-items-center border border-border text-[11px] font-bold" data-step-badge>1</span>Plan</li>
    <li class="h-px w-8 bg-border" aria-hidden="true"></li>
    <li data-step-item="2" class="flex items-center gap-2"><span class="grid h-6 w-6 place-items-center border border-border text-[11px] font-bold" data-step-badge>2</span>Owner</li>
    <li class="h-px w-8 bg-border" aria-hidden="true"></li>
    <li data-step-item="3" class="flex items-center gap-2"><span class="grid h-6 w-6 place-items-center border border-border text-[11px] font-bold" data-step-badge>3</span>Pharmacy</li>
    <li class="h-px w-8 bg-border" aria-hidden="true"></li>
    <li data-step-item="4" class="flex items-center gap-2"><span class="grid h-6 w-6 place-items-center border border-border text-[11px] font-bold" data-step-badge>4</span>Review &amp; pay</li>
  </ol>
  <div class="sm:hidden">
    <p class="text-[11px] font-semibold uppercase tracking-wide text-muted-foreground">Step <span data-step-n>1</span> of 4 · <span class="text-foreground" data-step-label>Plan</span></p>
    <div class="mt-2 h-1 w-full bg-muted"><div class="h-1 bg-primary" data-step-bar style="width:25%"></div></div>
  </div>
</nav>
