<header class="sticky top-0 z-30 border-b border-border bg-card">

    <nav class="hidden items-center gap-1 md:flex" aria-label="Site">
      <span class="px-3 text-sm text-muted-foreground">Questions? <span class="font-medium text-foreground">[SUPPORT EMAIL]</span></span>
