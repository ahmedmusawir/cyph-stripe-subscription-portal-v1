<!-- Review toolbar — artifact chrome only, hidden in PNG renders. Options are built by the runtime from html[data-states]. -->
<div class="review-bar" role="toolbar" aria-label="Review controls">
  <label>State <select data-set-state></select></label>
  <label>Mode <button type="button" data-set-mode="light" aria-pressed="false">Mist</button><button type="button" data-set-mode="dark" aria-pressed="true">Slate</button></label>
  <label>Tokens <button type="button" data-set-tokens="portal" aria-pressed="true">Portal (final)</button><button type="button" data-set-tokens="fleet" aria-pressed="false">Fleet (before)</button></label>
</div>
